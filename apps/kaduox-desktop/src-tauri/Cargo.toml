[package]
name = "kaduox-ssh-desktop"
version = "0.33.0-rc.21"
description = "Native Windows/macOS desktop client for Kaduox-SSH"
edition = "2024"
# The root CLI/workspace remains MSRV 1.85. Windows Pageant support used by
# the desktop client relies on let-chains stabilized in Rust 1.88.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kaduoxzero/Kaduox-SSH"

[lib]
name = "kaduox_ssh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
encoding_rs = "0.8"
kaduox-ssh-core = { path = "../../../crates/kaduox-ssh-core" }
kaduox-ssh-hosts = { path = "../../../crates/kaduox-ssh-hosts" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.47", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
zeroize = "1.8"

[workspace]
resolver = "2"

[target."cfg(windows)".dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
