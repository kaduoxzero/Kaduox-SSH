name: Finalize RSA compatibility policy

on:
  push:
    branches:
      - feat/v0.3-engineering
    paths:
      - .github/workflows/finalize-rsa-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.3-engineering
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Align tests and documentation with hardened RSA policy
        shell: python
        run: |
          from pathlib import Path

          integration = Path('scripts/ci/openssh-integration.sh')
          text = integration.read_text()
          old = '''echo '[integration] RSA server host-key verification path'
          rsa_host_output="$("$KSSH" 127.0.0.1 --port "$RSA_HOST_PORT" --user "$TEST_USER" --identity "$KEY" --host-key insecure exec -- printf rsa-host-ok)"
          [[ "$rsa_host_output" == 'rsa-host-ok' ]] || fail "RSA host-key server returned: $rsa_host_output"
          '''
          new = '''echo '[integration] RSA-only server host keys fail during algorithm negotiation'
          if "$KSSH" 127.0.0.1 --port "$RSA_HOST_PORT" --user "$TEST_USER" --identity "$KEY" --host-key insecure exec -- true >"$WORK/rsa-host.log" 2>&1; then
            fail 'RSA-only server host key unexpectedly succeeded while RSA verification is disabled'
          fi
          if grep -q 'Wrong server signature' "$WORK/rsa-host.log"; then
            cat "$WORK/rsa-host.log" >&2
            fail 'RSA host-key algorithm was advertised even though its verifier is disabled'
          fi
          grep -qi 'No common.*algorithm' "$WORK/rsa-host.log" || {
            cat "$WORK/rsa-host.log" >&2
            fail 'RSA-only host did not fail during algorithm negotiation'
          }
          '''
          if old not in text:
              raise SystemExit('RSA host integration block not found')
          integration.write_text(text.replace(old, new, 1))

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              '- RSA server host-key compatibility without enabling the affected local RSA signer\n',
              '- explicit early rejection of RSA-only server host keys while the affected RSA verification feature is disabled\n',
              1,
          )
          text = text.replace(
              '- RSA server host keys remain supported for host authentication; verifying a server signature does not require Kaduox-SSH to perform an RSA private-key operation.\n\nThe real OpenSSH integration suite continuously verifies direct RSA-key rejection, agent-backed RSA authentication, and connection to an RSA-host-key-only `sshd` fixture. Do not re-enable the Russh `rsa` feature until the advisory has an acceptable upstream resolution and the full security test suite remains green.\n',
              '- RSA-only server host keys are currently rejected during key-exchange negotiation. In Russh 0.63.1 the feature needed for RSA host-signature verification is coupled to the affected local RSA signer dependency, so Kaduox-SSH prefers a fail-closed compatibility tradeoff over advertising an algorithm it cannot safely verify. Servers should expose Ed25519 or ECDSA host keys.\n\nThe real OpenSSH integration suite continuously verifies direct RSA-key rejection, agent-backed RSA authentication, and early negotiation failure against an RSA-host-key-only `sshd` fixture. Do not re-enable the Russh `rsa` feature until the advisory has an acceptable upstream resolution and the full security test suite remains green.\n',
              1,
          )
          text = text.replace(
              'authentication, bastions, agent forwarding, RSA security policy and host-key compatibility, SFTP, synchronization, privilege switching, and TCP forwarding.',
              'authentication, bastions, agent forwarding, RSA signing policy and fail-closed RSA-only host negotiation, SFTP, synchronization, privilege switching, and TCP forwarding.',
              1,
          )
          readme.write_text(text)

          security = Path('SECURITY.md')
          text = security.read_text()
          text = text.replace(
              '- RSA server host keys remain an allowed compatibility path because host-key verification is a public-key operation and does not require Kaduox-SSH to possess or operate on an RSA private exponent.\n',
              '- RSA host-key algorithms are removed from the client preference list while the Russh feature that verifies them remains coupled to the affected RSA dependency. RSA-only servers must fail during key-exchange negotiation rather than after accepting an unsupported signature algorithm.\n',
              1,
          )
          text = text.replace(
              'The OpenSSH integration suite includes three independent regression checks: direct RSA private-key files are rejected, the same RSA identity succeeds through an external agent, and an RSA-host-key-only SSH server can still be authenticated with a non-RSA client key. Any change to crypto features must keep all three behaviors explicit.\n',
              'The OpenSSH integration suite includes three independent regression checks: direct RSA private-key files are rejected, the same RSA identity succeeds through an external agent, and an RSA-host-key-only SSH server is rejected during algorithm negotiation without reaching `WrongServerSig`. Any change to crypto features must keep all three behaviors explicit.\n',
              1,
          )
          security.write_text(text)
      - name: Validate staged policy
        run: |
          bash -n scripts/ci/openssh-integration.sh
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
      - name: Commit policy alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SECURITY.md scripts/ci/openssh-integration.sh
          git commit -m 'security: make RSA-only host rejection explicit'
          git push origin HEAD:feat/v0.3-engineering
