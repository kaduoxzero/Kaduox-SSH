name: OpenSSH Integration

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
      - integration/v0.6.0-candidate
      - integration/v0.7.0-candidate
      - integration/v0.8.0-candidate
      - integration/v0.9.0-candidate
      - integration/v0.10.0-candidate
      - integration/v0.11.0-candidate
      - integration/v0.12.0-candidate
      - integration/v0.13.0-candidate
      - integration/v0.14.0-candidate
      - integration/v0.15.0-candidate
      - integration/v0.16.0-candidate
      - integration/v0.17.0-candidate
      - integration/v0.18.0-candidate
      - integration/v0.19.0-candidate
      - integration/v0.20.0-candidate
      - integration/v0.21.0-candidate
      - integration/v0.22.0-candidate
      - integration/v0.23.0-candidate
      - integration/v0.24.0-candidate
      - integration/v0.25.0-candidate
      - integration/v0.26.0-candidate
      - integration/v0.27.0-candidate
      - integration/v0.28.0-candidate
      - integration/v0.29.0-candidate
      - integration/v0.30.0-candidate
      - integration/v0.31.0-candidate
      - integration/v0.32.0-candidate
      - integration/v0.33.0-candidate
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openssh:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install OpenSSH fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd curl libdbus-1-dev pkg-config
      - name: Build Kaduox-SSH
        run: cargo build --workspace --locked
      - name: Run real OpenSSH integration suite
        run: bash scripts/ci/openssh-integration.sh
      - name: Run OpenSSH host certificate integration suite
        run: bash scripts/ci/openssh-host-cert-integration.sh
      - name: Run default identity discovery integration suite
        run: bash scripts/ci/openssh-auth-discovery-integration.sh
      - name: Run connection probe integration suite
        run: bash scripts/ci/openssh-probe-integration.sh
      - name: Run typed command integration suite
        run: bash scripts/ci/openssh-command-spec-integration.sh
      - name: Run fleet execution integration suite
        run: bash scripts/ci/openssh-fleet-integration.sh

  windows-target:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Windows target (loopback OpenSSH server)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Enable loopback OpenSSH server with key authentication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          Start-Service sshd
          ssh-keygen -t ed25519 -f "$env:RUNNER_TEMP\kssh_ci_key" -N '""' -q
          Add-Content -Path "C:\ProgramData\ssh\administrators_authorized_keys" -Value (Get-Content "$env:RUNNER_TEMP\kssh_ci_key.pub") -Encoding ascii
      - name: Build kssh
        run: cargo build -p kaduox-ssh-cli --locked
      - name: Smoke-test exec and sudo rejection against the Windows target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kssh = "target/debug/kssh.exe"
          $key = "$env:RUNNER_TEMP\kssh_ci_key"
          $who = & $kssh 127.0.0.1 --user runneradmin --identity $key --host-key insecure exec -- whoami
          if ($who -notmatch 'runneradmin') { throw "unexpected whoami output: $who" }
          $sudo = & $kssh 127.0.0.1 --user runneradmin --identity $key --host-key insecure exec --as-user root -- whoami 2>&1 | Out-String
          if ($sudo -notmatch 'Windows targets do not support sudo') { throw "sudo was not rejected: $sudo" }
      - name: Run live Windows PTY test
        shell: pwsh
        env:
          KADUOX_LIVE_WINDOWS_HOST: 127.0.0.1
          KADUOX_LIVE_WINDOWS_USER: runneradmin
          KADUOX_LIVE_WINDOWS_KEY: ${{ env.RUNNER_TEMP }}\kssh_ci_key
        run: cargo test -p kaduox-ssh-core --locked windows_target_detects_platform_and_runs_cmd_pty -- --ignored --nocapture
