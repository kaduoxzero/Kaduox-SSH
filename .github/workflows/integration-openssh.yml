name: OpenSSH Integration

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
      - integration/v0.6.0-candidate
      - integration/v0.7.0-candidate
      - integration/v0.8.0-candidate
      - integration/v0.9.0-candidate
      - integration/v0.10.0-candidate
      - integration/v0.11.0-candidate
      - integration/v0.12.0-candidate
      - integration/v0.13.0-candidate
      - integration/v0.14.0-candidate
      - integration/v0.15.0-candidate
      - integration/v0.16.0-candidate
      - integration/v0.17.0-candidate
      - integration/v0.18.0-candidate
      - integration/v0.19.0-candidate
      - integration/v0.20.0-candidate
      - integration/v0.21.0-candidate
      - integration/v0.22.0-candidate
      - integration/v0.23.0-candidate
      - integration/v0.24.0-candidate
      - integration/v0.25.0-candidate
      - integration/v0.26.0-candidate
      - integration/v0.27.0-candidate
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openssh:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install OpenSSH fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd curl
      - name: Build Kaduox-SSH
        run: cargo build --workspace --locked
      - name: Run real OpenSSH integration suite
        run: bash scripts/ci/openssh-integration.sh
      - name: Run OpenSSH host certificate integration suite
        run: bash scripts/ci/openssh-host-cert-integration.sh
      - name: Run default identity discovery integration suite
        run: bash scripts/ci/openssh-auth-discovery-integration.sh
      - name: Run connection probe integration suite
        run: bash scripts/ci/openssh-probe-integration.sh
      - name: Run typed command integration suite
        run: bash scripts/ci/openssh-command-spec-integration.sh
      - name: Run fleet execution integration suite
        run: bash scripts/ci/openssh-fleet-integration.sh
