name: Desktop macOS installer

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "apps/kaduox-desktop/**"
      - "crates/**"
      - ".github/workflows/desktop-macos.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pkg:
    name: Universal 2 pkg installer + screenshots
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/kaduox-desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-macos-universal
          workspaces: apps/kaduox-desktop/src-tauri
      # The repository rust-toolchain.toml interferes with the action's
      # `targets` input, so install both Universal 2 targets explicitly.
      - name: Add Universal 2 Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Build Universal 2 app (unsigned)
        run: npm run tauri -- build --target universal-apple-darwin --bundles app --ci -- --locked
      - name: Package .pkg installer
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Kaduox SSH.app"
          test -d "$app"
          pkg="Kaduox-SSH-${version}-macos-universal.pkg"
          pkgbuild \
            --component "$app" \
            --install-location /Applications \
            --identifier com.kaduox.ssh \
            --version "$version" \
            "$pkg"
          ls -la "$pkg"
      - name: Launch app and capture screenshots
        run: |
          set -euo pipefail
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Kaduox SSH.app"
          out="$RUNNER_TEMP/kaduox-screenshots"
          mkdir -p "$out"
          open "$app"
          sleep 12
          osascript -e 'tell application "System Events" to tell process "Kaduox SSH" to set position of window 1 to {0, 25}' || true
          osascript -e 'tell application "Kaduox SSH" to activate' || true
          sleep 2
          screencapture -x "$out/01-launch.png"
          osascript -e 'tell application "Kaduox SSH" to quit' || true
          ls -la "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaduox-ssh-macos-universal
          path: |
            apps/kaduox-desktop/*.pkg
            ${{ runner.temp }}/kaduox-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
