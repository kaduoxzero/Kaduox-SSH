name: Refresh Cargo lockfile

on:
  push:
    branches:
      - feat/v0.3-engineering
    paths:
      - Cargo.toml
      - crates/**/Cargo.toml
      - .github/workflows/refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.3-engineering
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: refresh Cargo.lock without vulnerable RSA feature'
          git push origin HEAD:feat/v0.3-engineering
