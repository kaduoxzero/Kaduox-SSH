name: Sync v0.33.0 release body

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v033-release-body.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update GitHub Release description from corrected release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            repos/${GITHUB_REPOSITORY}/releases/384454796 \
            --raw-field body="$(cat docs/releases/v0.33.0-rc.1.md)"

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-v033-release-body.yml
          git commit -m "chore: remove one-shot release sync workflow [skip ci]"
          git push
