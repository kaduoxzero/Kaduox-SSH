name: Repair v0.33.0 release links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v033-release-links.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair README and release-note asset references
        shell: python
        run: |
          from pathlib import Path

          tag = "v0.33.0-rc.1"
          base = f"https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}"
          release_page = f"https://github.com/kaduoxzero/Kaduox-SSH/releases/tag/{tag}"

          replacements = {
              "README.zh-CN.md": [
                  (
                      "本次预发布仅提供 **Windows x64** 程序，不包含 Linux/macOS 桌面包。产物为本地手动构建，**未进行 Authenticode 签名**，Windows 可能提示发行者未知。请从本仓库 Releases 下载，并核对 SHA-256 校验值。",
                      "本次预发布仅提供 **Windows x64** 桌面程序与独立 MCP 程序，不包含 Linux/macOS 桌面包。产物为本地手动构建，**未进行 Authenticode 签名**，Windows 可能提示发行者未知。请仅从本仓库 Releases 下载。当前 Release 未单独附带 CLI/TUI 工具包和 SHA256SUMS.txt。"
                  ),
                  (
                      f"| [Windows 安装包](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/Kaduox-SSH-0.33.0-rc.1-windows-x64-setup.exe) | 推荐普通用户使用，可选择安装位置和中文/英文安装界面，包含 WebView2 离线安装组件。 |\n| [免安装桌面 EXE](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/Kaduox-SSH-0.33.0-rc.1-windows-x64.exe) | 电脑已安装 WebView2 Runtime 时直接运行；配置仍保存在当前用户的应用数据目录，不随 EXE 移动。 |\n| [CLI / TUI / Agent 工具包](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/Kaduox-SSH-0.33.0-rc.1-windows-x64-tools.zip) | 包含命令行、TUI、daemon、fleet、inventory 和 MCP 共六个程序。 |\n| [MCP 接口 EXE](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/kaduox-ssh-mcp.exe) | 只需要接入 Agent，不安装桌面客户端。 |\n| [SHA256SUMS.txt](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/SHA256SUMS.txt) | 核对下载文件，可使用 PowerShell：`Get-FileHash -Algorithm SHA256 <文件>`。 |",
                      f"| [Windows 安装包]({base}/Kaduox.SSH_0.33.0-rc.1_x64-setup.exe) | 推荐普通用户使用，可选择安装位置和中文/英文安装界面，包含 WebView2 离线安装组件。 |\n| [免安装桌面 EXE]({base}/Kaduox-SSH_0.33.0-rc.1_x64-portable.exe) | 电脑已安装 WebView2 Runtime 时直接运行；配置仍保存在当前用户的应用数据目录，不随 EXE 移动。 |\n| [MCP 接口 EXE]({base}/kaduox-ssh-mcp.exe) | 只需要接入 Agent，不安装桌面客户端。 |\n| [中文桌面手册（Release 附件）]({base}/DESKTOP_GUIDE.zh-CN.md) | 下载本次发布对应的中文桌面使用手册。 |\n| [查看全部 Release 资产]({release_page}) | CLI/TUI 工具包和 SHA256SUMS.txt 当前未作为本次 Release 附件发布。 |"
                  ),
              ],
              "README.md": [
                  (
                      "This prerelease provides **Windows x64** binaries. Linux/macOS desktop packages are not included. It is manually built and **not Authenticode-signed**; Windows may display an unknown-publisher warning. Download from this repository's Releases and compare the supplied SHA-256 checksums.",
                      "This prerelease provides **Windows x64** desktop binaries and a standalone MCP executable. Linux/macOS desktop packages are not included. It is manually built and **not Authenticode-signed**; Windows may display an unknown-publisher warning. Download only from this repository's Releases. This Release does not currently attach a CLI/TUI tools archive or SHA256SUMS.txt."
                  ),
                  (
                      f"| [Windows installer](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/Kaduox-SSH-0.33.0-rc.1-windows-x64-setup.exe) | Recommended: choose the installation directory and Chinese/English installer language. Includes the WebView2 offline installation component. |\n| [Standalone desktop EXE](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/Kaduox-SSH-0.33.0-rc.1-windows-x64.exe) | Run without installing the app; WebView2 Runtime must already be installed. Settings still use the current user's application-data directories. |\n| [CLI / TUI / Agent tools ZIP](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/Kaduox-SSH-0.33.0-rc.1-windows-x64-tools.zip) | Use the six command-line, daemon, inventory, fleet, and MCP programs. |\n| [MCP server EXE](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/kaduox-ssh-mcp.exe) | Connect an MCP-compatible Agent without installing the desktop client. |\n| [SHA256SUMS.txt](https://github.com/kaduoxzero/Kaduox-SSH/releases/download/{tag}/SHA256SUMS.txt) | Verify downloaded files, for example with PowerShell `Get-FileHash -Algorithm SHA256 <file>`. |",
                      f"| [Windows installer]({base}/Kaduox.SSH_0.33.0-rc.1_x64-setup.exe) | Recommended: choose the installation directory and Chinese/English installer language. Includes the WebView2 offline installation component. |\n| [Portable desktop EXE]({base}/Kaduox-SSH_0.33.0-rc.1_x64-portable.exe) | Run without installing the app; WebView2 Runtime must already be installed. Settings still use the current user's application-data directories. |\n| [MCP server EXE]({base}/kaduox-ssh-mcp.exe) | Connect an MCP-compatible Agent without installing the desktop client. |\n| [Chinese desktop guide (Release asset)]({base}/DESKTOP_GUIDE.zh-CN.md) | Download the desktop guide packaged with this prerelease. |\n| [View all Release assets]({release_page}) | The CLI/TUI tools archive and SHA256SUMS.txt are not attached to this Release. |"
                  ),
              ],
              "docs/releases/v0.33.0-rc.1.md": [
                  (
                      "这次发行提供 Windows x64 原生桌面客户端，以及匹配版本的 CLI/TUI、daemon 和 MCP 程序。",
                      "这次发行当前实际提供 Windows x64 原生桌面安装包、免安装桌面程序、独立 MCP 程序和中文桌面手册附件。CLI/TUI、daemon、fleet、inventory 工具包未作为本次 Release 附件单独发布。"
                  ),
                  (
                      "- `Kaduox-SSH-0.33.0-rc.1-windows-x64-setup.exe`：推荐给普通用户。可选择安装位置，包含 WebView2 离线安装组件。\n- `Kaduox-SSH-0.33.0-rc.1-windows-x64.exe`：独立桌面程序；电脑需已有 WebView2 Runtime。个人配置保存在当前用户的应用数据目录。\n- `Kaduox-SSH-0.33.0-rc.1-windows-x64-tools.zip`：包含 kssh、kssh-tui、kssh-daemon、kssh-fleet、kssh-inventory 和 kaduox-ssh-mcp，供命令行及 Agent 使用。\n- `kaduox-ssh-mcp.exe`：只需 MCP 接口时可单独下载。\n- `SHA256SUMS.txt`：下载后核对文件完整性。",
                      "- `Kaduox.SSH_0.33.0-rc.1_x64-setup.exe`：推荐给普通用户。可选择安装位置，包含 WebView2 离线安装组件。\n- `Kaduox-SSH_0.33.0-rc.1_x64-portable.exe`：免安装桌面程序；电脑需已有 WebView2 Runtime。个人配置保存在当前用户的应用数据目录。\n- `kaduox-ssh-mcp.exe`：只需 MCP 接口时可单独下载。\n- `DESKTOP_GUIDE.zh-CN.md`：本次发布对应的中文桌面使用手册。\n- CLI/TUI 工具包与 `SHA256SUMS.txt`：当前未作为本次 Release 附件发布。"
                  ),
                  (
                      "[完整中文手册](https://github.com/kaduoxzero/Kaduox-SSH/blob/develop/docs/DESKTOP_GUIDE.zh-CN.md) · [MCP 接入](https://github.com/kaduoxzero/Kaduox-SSH/blob/develop/docs/MCP.md) · [项目首页](https://github.com/kaduoxzero/Kaduox-SSH)",
                      "[完整中文手册](https://github.com/kaduoxzero/Kaduox-SSH/blob/main/docs/DESKTOP_GUIDE.zh-CN.md) · [MCP 接入](https://github.com/kaduoxzero/Kaduox-SSH/blob/main/docs/MCP.md) · [本次 Release](https://github.com/kaduoxzero/Kaduox-SSH/releases/tag/v0.33.0-rc.1) · [项目首页](https://github.com/kaduoxzero/Kaduox-SSH)"
                  ),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(filename)

          print("Updated:", ", ".join(changed))

      - name: Commit repaired links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md docs/releases/v0.33.0-rc.1.md
          git diff --cached --check
          git commit -m "docs: repair v0.33.0 release download links [skip ci]"
          git push
