name: Quality

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
      - integration/v0.6.0-candidate
      - integration/v0.7.0-candidate
      - integration/v0.8.0-candidate
      - integration/v0.9.0-candidate
      - integration/v0.10.0-candidate
      - integration/v0.11.0-candidate
      - integration/v0.12.0-candidate
      - integration/v0.13.0-candidate
      - integration/v0.14.0-candidate
      - integration/v0.15.0-candidate
      - integration/v0.16.0-candidate
      - integration/v0.17.0-candidate
      - integration/v0.18.0-candidate
      - integration/v0.19.0-candidate
      - integration/v0.20.0-candidate
      - integration/v0.21.0-candidate
      - integration/v0.22.0-candidate
      - integration/v0.23.0-candidate
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
      - name: Cache cargo-audit 0.22.0
        id: cargo-audit-cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.0-rust-1.98.1-${{ runner.os }}
      - name: Install cargo-audit 0.22.0
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo +1.98.1 install cargo-audit --version 0.22.0 --locked --no-default-features
      - name: Verify cargo-audit 0.22.0
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.1 audit --version | grep -F '0.22.0'
      - name: Audit resolved dependencies
        run: cargo +1.98.1 audit --file Cargo.lock

  release-policy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test release packaging, qualification, SBOM, workflow pins, and Rust policy
        run: python -m unittest scripts.release.test_release_tool scripts.release.test_qualification_tool scripts.release.test_sbom_tool scripts.release.test_action_pins scripts.release.test_rust_toolchain_policy
      - name: Validate repository release metadata
        run: python scripts/release/release_tool.py check
