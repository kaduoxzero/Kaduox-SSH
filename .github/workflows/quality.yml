name: Quality

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
      - integration/v0.6.0-candidate
      - integration/v0.7.0-candidate
      - integration/v0.8.0-candidate
      - integration/v0.9.0-candidate
      - integration/v0.10.0-candidate
      - integration/v0.11.0-candidate
      - integration/v0.12.0-candidate
      - integration/v0.13.0-candidate
      - integration/v0.14.0-candidate
      - integration/v0.15.0-candidate
      - integration/v0.16.0-candidate
      - integration/v0.17.0-candidate
      - integration/v0.18.0-candidate
      - integration/v0.19.0-candidate
      - integration/v0.20.0-candidate
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit resolved dependencies
        uses: actions-rust-lang/audit@v1
        with:
          file: Cargo.lock
          createIssues: false

  release-policy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test release packaging policy
        run: python -m unittest scripts.release.test_release_tool
      - name: Validate repository release metadata
        run: python scripts/release/release_tool.py check
