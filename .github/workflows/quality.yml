name: Quality

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
      - integration/v0.6.0-candidate
      - integration/v0.7.0-candidate
      - integration/v0.8.0-candidate
      - integration/v0.9.0-candidate
      - integration/v0.10.0-candidate
      - integration/v0.11.0-candidate
      - integration/v0.12.0-candidate
      - integration/v0.13.0-candidate
      - integration/v0.14.0-candidate
      - integration/v0.15.0-candidate
      - integration/v0.16.0-candidate
      - integration/v0.17.0-candidate
      - integration/v0.18.0-candidate
      - integration/v0.19.0-candidate
      - integration/v0.20.0-candidate
      - integration/v0.21.0-candidate
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref 2026-07-16
      - name: Audit resolved dependencies
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          file: Cargo.lock
          createIssues: false

  release-policy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test release packaging, SBOM, and workflow action-pin policy
        run: python -m unittest scripts.release.test_release_tool scripts.release.test_sbom_tool scripts.release.test_action_pins
      - name: Validate repository release metadata
        run: python scripts/release/release_tool.py check
