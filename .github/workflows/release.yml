name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test release packaging and SBOM policy
        run: python -m unittest scripts.release.test_release_tool scripts.release.test_sbom_tool
      - name: Verify release metadata and tag
        run: python scripts/release/release_tool.py check --tag "$GITHUB_REF_NAME"
      - name: Require release commit to be reachable from main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  sbom:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate deterministic SPDX lockfile inventory
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          python scripts/release/sbom_tool.py \
            --tag "$GITHUB_REF_NAME" \
            --source-date-epoch "$source_date_epoch" \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: dist/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            exe_suffix: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            exe_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            exe_suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            exe_suffix: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Verify release metadata and tag
        shell: bash
        run: python scripts/release/release_tool.py check --tag "$GITHUB_REF_NAME"
      - name: Build all release binaries
        run: cargo build -p kaduox-ssh-cli --release --locked --bins --target ${{ matrix.target }}
      - name: Smoke-test every release binary
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for binary in kssh kssh-tui kssh-fleet kssh-inventory; do
            path="target/${{ matrix.target }}/release/${binary}${{ matrix.exe_suffix }}"
            test -f "$path"
            output="$($path --version)"
            printf '%s\n' "$output"
            grep -F -- "$version" <<<"$output" >/dev/null
          done
      - name: Package release suite
        shell: bash
        run: >-
          python scripts/release/release_tool.py package
          --tag "$GITHUB_REF_NAME"
          --target "${{ matrix.target }}"
          --format "${{ matrix.archive }}"
          --exe-suffix "${{ matrix.exe_suffix }}"
          --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    needs:
      - build
      - sbom
    if: ${{ vars.KADUOX_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_pattern: '*.tar.gz'
          - target: x86_64-apple-darwin
            archive_pattern: '*.tar.gz'
          - target: aarch64-apple-darwin
            archive_pattern: '*.tar.gz'
          - target: x86_64-pc-windows-msvc
            archive_pattern: '*.zip'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-sbom
          path: dist
      - name: Resolve exact attestation inputs
        id: attestation-inputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name '${{ matrix.archive_pattern }}' -print | sort)
          mapfile -t sboms < <(find dist -maxdepth 1 -type f -name '*.spdx.json' -print | sort)
          if [[ ${#archives[@]} -ne 1 ]]; then
            printf 'expected exactly one archive for %s, found %s\n' '${{ matrix.target }}' "${#archives[@]}" >&2
            exit 1
          fi
          if [[ ${#sboms[@]} -ne 1 ]]; then
            printf 'expected exactly one release SPDX SBOM, found %s\n' "${#sboms[@]}" >&2
            exit 1
          fi
          printf 'archive=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"
          printf 'sbom=%s\n' "${sboms[0]}" >> "$GITHUB_OUTPUT"
      - name: Attest release archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.attestation-inputs.outputs.archive }}
          create-storage-record: false
      - name: Bind lockfile SPDX inventory to release archive
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.attestation-inputs.outputs.archive }}
          sbom-path: ${{ steps.attestation-inputs.outputs.sbom }}
          create-storage-record: false

  publish:
    needs:
      - preflight
      - sbom
      - build
      - attest
    if: ${{ always() && needs.preflight.result == 'success' && needs.sbom.result == 'success' && needs.build.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release archive and SBOM set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print | sort)
          mapfile -t sboms < <(find dist -maxdepth 1 -type f -name '*.spdx.json' -print | sort)
          if [[ ${#archives[@]} -ne 4 ]]; then
            printf 'expected 4 release archives, found %s\n' "${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          if [[ ${#sboms[@]} -ne 1 ]]; then
            printf 'expected 1 release-wide SPDX SBOM, found %s\n' "${#sboms[@]}" >&2
            printf '%s\n' "${sboms[@]}" >&2
            exit 1
          fi
          (cd dist && sha256sum *.tar.gz *.zip *.spdx.json 2>/dev/null | sort -k2 > SHA256SUMS)
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          cat dist/SHA256SUMS
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag \
            "${extra[@]}"
