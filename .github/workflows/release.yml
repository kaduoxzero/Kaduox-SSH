name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test release packaging, workflow pins, and Rust toolchain policy
        run: python -m unittest scripts.release.test_release_tool scripts.release.test_action_pins scripts.release.test_rust_toolchain_policy
      - name: Verify release metadata and tag
        run: python scripts/release/release_tool.py check --tag "$GITHUB_REF_NAME"
      - name: Require release commit to be reachable from main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  desktop-windows:
    needs: preflight
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build MCP server
        run: cargo build -p kaduox-ssh-mcp --release --locked
      - name: Build desktop NSIS installer
        working-directory: apps/kaduox-desktop
        run: |
          npm ci
          npm test
          npm run tauri -- build --bundles nsis --ci -- --locked
      - name: Collect desktop Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "apps/kaduox-desktop/src-tauri/target/release/bundle/nsis/Kaduox SSH_${version}_x64-setup.exe" "dist/Kaduox-SSH-${version}-windows-x64-setup.exe"
          Copy-Item target/release/kaduox-ssh-mcp.exe dist/kaduox-ssh-mcp.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    needs: preflight
    permissions:
      contents: read
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/kaduox-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
      # The repository rust-toolchain.toml interferes with the action's
      # `targets` input, so install both Universal 2 targets explicitly.
      - name: Add Universal 2 Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-desktop-macos-universal
          workspaces: apps/kaduox-desktop/src-tauri
      - name: Install and test frontend
        run: |
          npm ci
          npm test
      - name: Build Universal 2 app (unsigned)
        run: npm run tauri -- build --target universal-apple-darwin --bundles app --ci -- --locked
      - name: Package .pkg installer
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Kaduox SSH.app"
          test -d "$app"
          # dist/ 同时是前端构建输出目录，pkg 须放进干净的暂存目录，
          # 否则 release 环节的精确资产数校验会被前端文件顶爆。
          mkdir -p dist-release
          pkgbuild \
            --component "$app" \
            --install-location /Applications \
            --identifier com.kaduox.ssh \
            --version "$version" \
            "dist-release/Kaduox-SSH-${version}-macos-universal.pkg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos
          path: apps/kaduox-desktop/dist-release/*
          if-no-files-found: error
          retention-days: 7

  # 纯桌面端发行契约：恰好 3 个资产（Windows 安装器、macOS pkg、MCP server），
  # 由本 job 直接创建 Release。校验和由 GitHub 资产页自动提供 sha256 digest。
  release:
    needs:
      - preflight
      - desktop-windows
      - desktop-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Verify exact desktop asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/Kaduox-SSH-${version}-windows-x64-setup.exe"
          test -f "dist/Kaduox-SSH-${version}-macos-universal.pkg"
          test -f "dist/kaduox-ssh-mcp.exe"
          mapfile -t files < <(find dist -maxdepth 1 -type f -print | sort)
          if [[ ${#files[@]} -ne 3 ]]; then
            printf 'invalid desktop asset set: expected exactly 3 files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Curated release notes are mandatory: docs/releases/v<version>.md must
          # exist and its first heading becomes the release title. A missing file
          # fails closed instead of publishing a bare auto-generated changelog.
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          title="$(head -n 1 "$notes" | sed -e 's/^#[[:space:]]*//')"
          test -n "$title"
          extra=(--title "$title" --notes-file "$notes")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${extra[@]}"
