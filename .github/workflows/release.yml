name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test release packaging, qualification, SBOM, workflow pins, and Rust policy
        run: python -m unittest scripts.release.test_release_tool scripts.release.test_qualification_tool scripts.release.test_release_qualification_policy scripts.release.test_sbom_tool scripts.release.test_action_pins scripts.release.test_rust_toolchain_policy
      - name: Verify release metadata and tag
        run: python scripts/release/release_tool.py check --tag "$GITHUB_REF_NAME"
      - name: Require release commit to be reachable from main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  sbom:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Generate deterministic SPDX lockfile inventory
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          python scripts/release/sbom_tool.py \
            --tag "$GITHUB_REF_NAME" \
            --source-date-epoch "$source_date_epoch" \
            --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: dist/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            exe_suffix: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            exe_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            exe_suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            exe_suffix: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # action commit reviewed 2026-09-03
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Verify release metadata and tag
        shell: bash
        run: python scripts/release/release_tool.py check --tag "$GITHUB_REF_NAME"
      - name: Build all release binaries
        run: cargo build -p kaduox-ssh-cli --release --locked --bins --target ${{ matrix.target }}
      - name: Smoke-test every release binary
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for binary in kssh kssh-tui kssh-fleet kssh-inventory; do
            path="target/${{ matrix.target }}/release/${binary}${{ matrix.exe_suffix }}"
            test -f "$path"
            output="$($path --version)"
            printf '%s\n' "$output"
            grep -F -- "$version" <<<"$output" >/dev/null
          done
      - name: Package release suite
        shell: bash
        run: >-
          python scripts/release/release_tool.py package
          --tag "$GITHUB_REF_NAME"
          --target "${{ matrix.target }}"
          --format "${{ matrix.archive }}"
          --exe-suffix "${{ matrix.exe_suffix }}"
          --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    needs:
      - build
      - sbom
    if: ${{ vars.KADUOX_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify exact attestation subject set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print | sort)
          mapfile -t sboms < <(find dist -maxdepth 1 -type f -name '*.spdx.json' -print | sort)
          mapfile -t unexpected < <(find dist -maxdepth 1 -type f ! \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.spdx.json' \) -print | sort)
          if [[ ${#archives[@]} -ne 4 || ${#sboms[@]} -ne 1 || ${#unexpected[@]} -ne 0 ]]; then
            printf 'invalid attestation subject set: archives=%s sboms=%s unexpected=%s\n' \
              "${#archives[@]}" "${#sboms[@]}" "${#unexpected[@]}" >&2
            exit 1
          fi
      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
          create-storage-record: false

  publish:
    needs:
      - preflight
      - sbom
      - build
      - attest
    if: ${{ always() && needs.preflight.result == 'success' && needs.sbom.result == 'success' && needs.build.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release archive and SBOM set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print | sort)
          mapfile -t sboms < <(find dist -maxdepth 1 -type f -name '*.spdx.json' -print | sort)
          if [[ ${#archives[@]} -ne 4 ]]; then
            printf 'expected 4 release archives, found %s\n' "${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          if [[ ${#sboms[@]} -ne 1 ]]; then
            printf 'expected 1 release-wide SPDX SBOM, found %s\n' "${#sboms[@]}" >&2
            printf '%s\n' "${sboms[@]}" >&2
            exit 1
          fi
          (cd dist && sha256sum *.tar.gz *.zip *.spdx.json 2>/dev/null | sort -k2 > SHA256SUMS)
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          cat dist/SHA256SUMS
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag \
            "${extra[@]}"
