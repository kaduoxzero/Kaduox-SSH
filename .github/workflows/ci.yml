name: CI

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
      - integration/v0.6.0-candidate
      - integration/v0.7.0-candidate
      - integration/v0.8.0-candidate
      - integration/v0.9.0-candidate
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked

  msrv:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: MSRV (Rust 1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --workspace --all-targets --locked
